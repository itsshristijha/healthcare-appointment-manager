# Render.com "Blueprint" — one-click deploy.
# In the Render dashboard: New -> Blueprint -> point at this repo -> Apply.
# It provisions a free Postgres instance and wires DATABASE_URL to the
# backend automatically. Fill in the optional LLM/email/calendar keys
# under the backend service's Environment tab after the first deploy if
# you want live integrations instead of the built-in mocks.
databases:
  - name: healthcare-appointments-db
    plan: free
    databaseName: healthcare_appointments
    user: healthcare_app

services:
  - type: web
    name: healthcare-appointments-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/db/migrate.js && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-appointments-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

  - type: web
    name: healthcare-appointments-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
